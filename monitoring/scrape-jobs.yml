# Copy this job into your existing scrape_configs list.
# This address works when the scraper shares Lork's Docker network.
# A host scraper can use 127.0.0.1:<published-Lork-port> instead.
# Container loopback is that container, not the Docker host.
- job_name: lork
  metrics_path: /metrics
  scrape_interval: 15s
  scrape_timeout: 10s
  static_configs:
    - targets: ["lork:5090"]
